
name: Build launcher
 
on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
 
      - name: Accetta le licenze dell'SDK Android già installato
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
 
      - name: Compila APK debug
        working-directory: launcher
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
 
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
